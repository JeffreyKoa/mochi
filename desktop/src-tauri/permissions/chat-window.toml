[[permission]]
identifier = "allow-chat-window"
description = "Allow chat window show/hide and pet resize"
commands.allow = [
  "show_chat_window",
  "hide_chat_window",
  "expand_pet_for_chat",
  "collapse_pet_chat",
  "recover_pet_window",
  "get_voice_sidecar_status",
  "restart_voice_sidecars",
]
